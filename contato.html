<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fale com a TecnoLógica: parcerias, envio de notícias e sugestões.">

    <title>TecnoLógica - Contato</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header id="header">

        <div id="logo">
            <h1>Tecno<span class="white">Lógica</span></h1>
        </div>

        <nav id="menu">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="jogos.html">Jogos</a>
                </li>
                <li>
                    <a href="smartphones.html">Smartphones</a>
                </li>
                <li>
                    <a href="contato.html" aria-current="page">Contato</a>
                </li>
            </ul>
        </nav>

        <button
            type="button"
            id="botao-tema"
            aria-label="Alternar entre tema claro e escuro"
            title="Alternar tema">
            🌙
        </button>

    </header>

    <main id="content">

        <section class="post">

            <h2>Fale com a gente</h2>

            <p>
                Quer propor uma parceria, enviar uma notícia ou deixar
                uma sugestão? Preencha o formulário abaixo.
            </p>

            <form id="form-contato" method="post" novalidate>

                <div class="campo">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome">

                    <span class="erro" id="erro-nome"></span>

                </div>

                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email">

                    <span class="erro" id="erro-email"></span>

                </div>

                <div class="campo">

                    <label for="assunto">Assunto</label>

                    <select id="assunto" name="assunto">

                        <option value="">Selecione um assunto</option>
                        <option value="parceria">Parceria</option>
                        <option value="noticia">Enviar notícia</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="outro">Outro</option>

                    </select>

                    <span class="erro" id="erro-assunto"></span>

                </div>

                <div class="campo">

                    <label for="mensagem">Mensagem</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"></textarea>

                    <span class="erro" id="erro-mensagem"></span>

                </div>

                <button type="submit">
                    Enviar mensagem
                </button>

                <p id="status-form" role="status"></p>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 TecnoLógica - Todos os direitos reservados.
        </p>

    </footer>

</body>
</html>
